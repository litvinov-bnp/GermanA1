<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Немецкие слова</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="flag" viewBox="0 0 5 3" role="img" aria-label="Флаг Германии">
    <rect width="5" height="1" y="0" fill="#000000"/>
    <rect width="5" height="1" y="1" fill="#DD0000"/>
    <rect width="5" height="1" y="2" fill="#FFCE00"/>
  </svg>

  <h1>Hallo, Deutsch!</h1>
  <p>Приложение для изучения 1000 немецких слов (Goethe A1 Wortliste + Grundwortschatz)</p>

  <main>
    <p id="topic"></p>
    <h2 id="word">Загрузка…</h2>

    <form id="quiz">
      <input id="answer" type="text" placeholder="Перевод по-русски"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="action" type="submit">Проверить</button>
    </form>

    <p id="result"></p>
    <p id="example"></p>
  </main>
  
</body>
</html>
